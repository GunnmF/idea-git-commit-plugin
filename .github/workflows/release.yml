name: release

# 推 master 即发版：CI 构建插件 zip，自动建 tag + Release 并上传。
#
# 分支约定：平时在 dev 上开发，只有要出新版时才合并到 master。所以「推 master」
# 等于「我要发版」，不需要再单独打 tag —— tag 由本 workflow 在构建时创建，
# 指向被编译的那个 commit（--target "$GITHUB_SHA"）。
#
# 版本号 = gradle.properties 里 pluginVersion 的 major.minor + CI 构建号
# （github.run_number 全仓库单调递增，保证每次 CI 构建版本号都不同），
# 通过 -PciBuildNumber 传给 Gradle；要升 minor/major 就改 gradle.properties。
# 本地 ./gradlew buildPlugin 不受影响，仍走 version.properties 自增。
#
# 第三方 action 全部锁到 commit SHA（不用 @v4 这种可被重新指向的 tag），
# 权限压到最小（只要 contents:write 用来建 Release）。
on:
  push:
    branches: [master]
  workflow_dispatch: # 手动触发时用 master 的 HEAD 重新发一次当前版本

permissions:
  contents: write # 创建 Release / 上传附件，除此之外一律不给

jobs:
  build:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: version
        name: 计算版本号
        run: |
          set -euo pipefail
          BASE=$(grep '^pluginVersion' gradle.properties | cut -d= -f2 | tr -d ' ' | cut -d. -f1-2)
          echo "version=$BASE.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "本次版本：$BASE.${{ github.run_number }}"

      - id: check
        name: 判断这次要不要真的发
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          # 推 master 未必都是发版（偶尔推个文档修正）。这个版本的 release 已经
          # 有 zip 就跳过；上次发版中途挂了的话 zip 不在，会重跑并补齐，自带修复能力
          NAMES=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if echo "$NAMES" | grep -q '\.zip$'; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG 已经发过了（zip 在），本次跳过构建"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "准备发 $TAG"
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.check.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: 17 # 与 build.gradle.kts 的 jvmToolchain(17) 一致

      # 缓存 ~/.gradle：IntelliJ 平台发行版有 1GB+，不缓存每次构建都要重新下 20 分钟
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        if: steps.check.outputs.publish == 'true'

      - name: 构建插件 zip
        if: steps.check.outputs.publish == 'true'
        run: ./gradlew buildPlugin -PciBuildNumber=${{ github.run_number }} --console=plain

      - name: 建 tag + Release 并上传 zip
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          ZIP=$(ls build/distributions/*.zip)
          test -f "$ZIP" || { echo "::error::没找到 build/distributions/*.zip"; exit 1; }
          # --target 让 tag 精确落在被构建的这个 commit 上：master 后面还会继续
          # 往前走，用默认分支 HEAD 建 tag 会标到没构建过的代码上
          gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --generate-notes "$ZIP"
