# 插件信息
pluginGroup = com.fanchen.aicommit
pluginName = ai-git-commit
pluginVersion = 0.1.0

# 目标平台（IC = IDEA Community，开发沙箱用它运行；插件本身兼容 WebStorm 等所有 JetBrains IDE）
platformType = IC
platformVersion = 2024.2.5

# 兼容范围：242+（2024.2 起），留空 untilBuild 表示不设上限（兼容 2026.x 的 WebStorm）
pluginSinceBuild = 242
pluginUntilBuild =

# Gradle 性能
org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching = true
org.gradle.parallel = true
kotlin.incremental = true
